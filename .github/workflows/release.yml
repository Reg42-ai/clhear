name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/reg42-ai/clhear:${{ github.ref_name }}
      - name: Write release manifest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 - << 'PY'
          import json, os
          tag = os.environ["TAG"]
          digest = os.environ["IMAGE_DIGEST"]
          manifest = {
              "engine_version": tag[1:] if tag.startswith("v") else tag,
              "api_version": "v1",
              "api_compatible_with": ["v1"],
              "image": f"ghcr.io/reg42-ai/clhear@{digest}",
              "schema_revision_from": "0040",
              "schema_revision_to": "0041",
              "migrations_reversible": False,
              "breaking": False,
              "changelog_url": f"https://github.com/Reg42-ai/clhear/releases/tag/{tag}",
          }
          with open("release-manifest.json", "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, indent=2)
              fh.write("\n")
          PY
      - uses: softprops/action-gh-release@v2
        with:
          files: release-manifest.json
