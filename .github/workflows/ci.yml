name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Denylist
        run: python -m app.clhear.denylist
      - name: OpenAPI drift
        run: python -m app.clhear.openapi_doc --check
      - name: Contract tests
        run: python -m pytest tests/contract -q
