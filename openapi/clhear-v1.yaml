components:
  schemas:
    AdapterDefinition:
      additionalProperties: false
      properties:
        adapter:
          title: Adapter
          type: string
        config:
          additionalProperties: true
          title: Config
          type: object
        locator:
          additionalProperties: true
          title: Locator
          type: object
      required:
      - adapter
      title: AdapterDefinition
      type: object
    ContributionProposal:
      additionalProperties: false
      description: 'Public parsing rules and clause mappings.


        List source keys, adapter definitions, normalizer rules, and structural

        elements (an element id, a clause reference, and a provenance hash).

        Organisation facts, live controls, owners, evidence locators, database

        URLs, and credentials are rejected. Validating this document sends it nowhere.'
      properties:
        adapter_definitions:
          items:
            $ref: '#/components/schemas/AdapterDefinition'
          title: Adapter Definitions
          type: array
        normalizer_rules:
          items:
            $ref: '#/components/schemas/NormalizerRule'
          title: Normalizer Rules
          type: array
        source_keys:
          items:
            type: string
          title: Source Keys
          type: array
        structural_elements:
          items:
            $ref: '#/components/schemas/StructuralElement'
          title: Structural Elements
          type: array
      required:
      - source_keys
      title: ContributionProposal
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    NormalizerRule:
      additionalProperties: false
      properties:
        name:
          title: Name
          type: string
        pattern:
          default: ''
          title: Pattern
          type: string
        replacement:
          default: ''
          title: Replacement
          type: string
      required:
      - name
      title: NormalizerRule
      type: object
    ProfileBody:
      additionalProperties: false
      properties:
        attributes:
          additionalProperties: true
          title: Attributes
          type: object
        name:
          default: ''
          title: Name
          type: string
      required:
      - attributes
      title: ProfileBody
      type: object
    RunBody:
      additionalProperties: false
      properties:
        profiles:
          items:
            type: string
          title: Profiles
          type: array
        scope:
          title: Scope
          type: string
      required:
      - scope
      title: RunBody
      type: object
    ScopeBody:
      additionalProperties: false
      properties:
        label:
          default: ''
          title: Label
          type: string
        name:
          title: Name
          type: string
        sources:
          items:
            type: string
          title: Sources
          type: array
      required:
      - name
      - sources
      title: ScopeBody
      type: object
    SourceBody:
      additionalProperties: false
      properties:
        adapter:
          title: Adapter
          type: string
        enabled:
          default: true
          title: Enabled
          type: boolean
        issuer:
          default: ''
          title: Issuer
          type: string
        jurisdiction:
          default: ''
          title: Jurisdiction
          type: string
        kind:
          default: guidance
          title: Kind
          type: string
        licence:
          default: open
          title: Licence
          type: string
        locator:
          additionalProperties: true
          title: Locator
          type: object
        name:
          default: ''
          title: Name
          type: string
        schedule:
          default: ''
          title: Schedule
          type: string
      required:
      - adapter
      title: SourceBody
      type: object
    SourceCreate:
      additionalProperties: false
      properties:
        adapter:
          title: Adapter
          type: string
        enabled:
          default: true
          title: Enabled
          type: boolean
        issuer:
          default: ''
          title: Issuer
          type: string
        jurisdiction:
          default: ''
          title: Jurisdiction
          type: string
        key:
          title: Key
          type: string
        kind:
          default: guidance
          title: Kind
          type: string
        licence:
          default: open
          title: Licence
          type: string
        locator:
          additionalProperties: true
          title: Locator
          type: object
        name:
          default: ''
          title: Name
          type: string
        schedule:
          default: ''
          title: Schedule
          type: string
      required:
      - adapter
      - key
      title: SourceCreate
      type: object
    StructuralElement:
      additionalProperties: false
      properties:
        element_id:
          title: Element Id
          type: string
        obligation_clause_ref:
          title: Obligation Clause Ref
          type: string
        provenance_hash:
          title: Provenance Hash
          type: string
      required:
      - element_id
      - obligation_clause_ref
      - provenance_hash
      title: StructuralElement
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    WebhookBody:
      additionalProperties: false
      properties:
        secret:
          title: Secret
          type: string
        url:
          title: Url
          type: string
      required:
      - url
      - secret
      title: WebhookBody
      type: object
info:
  description: One CLHEAR install. Register the texts you choose, describe the organisation,
    and POST /v1/runs. The call returns a run id. The worker writes the blueprint.
    Read items, explanations, and clause pointers from the release. ContributionProposal
    is checked locally and is sent nowhere.
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html
  title: CLHEAR
  version: 0.2.0
openapi: 3.1.0
