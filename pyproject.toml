[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clhear"
version = "0.1.0"
description = "Open engine that turns chosen regulatory sources into a reference compliance blueprint."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
authors = [{name = "Reg42 AI"}]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "sqlalchemy>=2.0",
  "pydantic>=2",
  "pydantic-settings>=2",
  "httpx>=0.27",
  "anthropic>=1.8",
  "boto3>=1.35",
  "PyYAML>=6",
  "beautifulsoup4>=4.12",
  "pypdf>=5",
  "pdfminer.six>=20240706",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
clhear = "app.clhear.cli:main"

[tool.setuptools.packages.find]
include = ["app*", "migrations*"]

[tool.setuptools.package-data]
"app.clhear.curated" = ["*.json"]
"app.clhear.l2" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["app", "migrations", "tests"]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["F401", "F841"]
"app/clhear/l1/**" = ["F401", "F841"]
"app/clhear/l2/**" = ["F401", "F841"]
"app/clhear/l3/**" = ["F401", "F841"]
"app/clhear/l4/**" = ["F401", "F841"]
"app/clhear/l5/**" = ["F401", "F841"]
"app/clhear/l6/**" = ["F401", "F841"]
"app/clhear/l7/**" = ["F401", "F841"]
"app/clhear/l8/**" = ["F401", "F841"]
"app/clhear/platform/**" = ["F401", "F841"]
"app/clhear/accounts.py" = ["F401", "F841"]
"app/clhear/community.py" = ["F401", "F841"]
"app/clhear/eval_studio.py" = ["F401", "F841"]
"app/clhear/fleets.py" = ["F401", "F841"]
"app/clhear/releases.py" = ["F401", "F841"]
"app/clhear/workers.py" = ["F401", "F841"]
